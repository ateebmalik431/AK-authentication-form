<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Work Experience</title>
</head>
<body>

    <h1>Signup Form</h1>
    <h2>Step 3: Work Experience</h2>

    <form action="signup4.html" method="get">

        <label>Current Job Title:</label>
        <input type="text" name="jobTitle"
               placeholder="Enter your current job title" required>
        <br><br>

        <label>Years of Experience:</label>
        <input type="number" name="experience" min="0" max="70"
               placeholder="Enter years of experience" required>
        <br><br>

        <label>Employment Start Date:</label>
        <input type="month" name="startDate">
        <br><br>

        <label>Upload Resume:</label>
        <input type="file" name="resume" accept=".pdf,.doc,.docx">
        <br><br>

        <label>Skills:</label>
        <input type="text" name="skill" list="skillOptions"
               placeholder="Enter or select your skills">

        <datalist id="skillOptions">
            <option value="HTML">
            <option value="CSS">
            <option value="JavaScript">
            <option value="Communication">
            <option value="Teamwork">
            <option value="Problem Solving">
            <option value="Microsoft Office">
            <option value="Graphic Design">
        </datalist>
        <br><br>

        <a href="signup2.html">Back</a>
        &nbsp;
        <button type="submit">Next</button>

    </form>

    <br>
    <a href="index.html">Home Page</a>

</body>
</html>
