<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Information</title>
</head>
<body>

    <h1>Signup Form</h1>
    <h2>Step 2: Contact Information</h2>

    <form action="signup3.html" method="get">

        <label>Phone Number:</label>
        <input type="tel" name="phone"
               placeholder="Enter your phone number" required>
        <br><br>

        <label>Country:</label>
        <input type="text" name="country" list="countries"
               placeholder="Enter or select your country" required>

        <datalist id="countries">
            <option value="Pakistan">
            <option value="India">
            <option value="United Kingdom">
            <option value="United States">
            <option value="Saudi Arabia">
            <option value="United Arab Emirates">
            <option value="Canada">
            <option value="Australia">
        </datalist>
        <br><br>

        <label>Address:</label>
        <input type="text" name="address"
               placeholder="Enter your street or area">
        <br><br>

        <label>Full Address:</label>
        <textarea name="fullAddress"
                  placeholder="Enter your complete address"
                  required></textarea>
        <br><br>

        <label>Preferred Contact Method:</label>
        <select name="contactMethod" required>
            <option value="">Select your contact method</option>
            <option value="Email">Email</option>
            <option value="Phone">Phone Call</option>
            <option value="SMS">SMS</option>
            <option value="WhatsApp">WhatsApp</option>
        </select>
        <br><br>

        <input type="checkbox" name="terms" required>
        I agree to the Terms and Conditions.
        <br><br>

        <a href="signup1.html">Back</a>
        &nbsp;
        <button type="submit">Next</button>

    </form>

    <br>
    <a href="index.html">Home Page</a>

</body>
</html>
